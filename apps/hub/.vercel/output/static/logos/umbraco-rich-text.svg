<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true">
  <!-- A pilcrow in the family's blue, violet and pink: rich text, rendered. -->
  <defs>
    <linearGradient id="pilcrow" x1="52" y1="36" x2="204" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset=".52" stop-color="#9b83ec"/>
