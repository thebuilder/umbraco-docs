    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <g id="mark">
      <path d="M142 36 H108 A54 54 0 0 0 108 144 H142 Z"/>
      <rect x="116" y="36" width="88" height="26" rx="13"/>
      <rect x="116" y="36" width="26" height="184" rx="13"/>
